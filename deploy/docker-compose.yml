# Atomic Chat. From this folder:
#   cp .env.example .env && edit .env
#   docker compose up -d                          # server only, on http://localhost:${ATOMIC_PORT}
#   docker compose --profile caddy up -d          # + Caddy with HTTPS (domain or bare IP)
#   docker compose --profile tunnel up -d         # + Cloudflare Tunnel (no open ports)
#   docker compose --profile minio up -d          # + local MinIO for trying S3 storage (dev only)
#   docker compose --profile ntfy up -d           # + ntfy push server
# Everything that must survive is in the `atomic-data` volume (database, config, local files, backups).

name: atomic-chat

services:
  atomic:
    image: ${ATOMIC_IMAGE:-ghcr.io/uri-travoski/atomic-chat-server:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      ATOMIC_PUBLIC_URL: ${ATOMIC_PUBLIC_URL:-}
      ATOMIC_NAME: ${ATOMIC_NAME:-Atomic Chat}
      ATOMIC_BOOTSTRAP_ADMIN: ${ATOMIC_BOOTSTRAP_ADMIN:-}
      ATOMIC_MAX_UPLOAD_MB: ${ATOMIC_MAX_UPLOAD_MB:-100}
      ATOMIC_NTFY_URL: ${ATOMIC_NTFY_URL:-}
    volumes:
      - atomic-data:/data
    ports:
      - "${ATOMIC_BIND_ADDR:-0.0.0.0}:${ATOMIC_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [atomic]
    environment:
      ATOMIC_HOST: ${ATOMIC_HOST:?set ATOMIC_HOST in .env}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [atomic]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}

  ntfy:
    profiles: ["ntfy"]
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy-data:/var/lib/ntfy
    ports:
      - "127.0.0.1:2586:80"

  minio:
    profiles: ["minio"]
    # MinIO stopped publishing images to Docker Hub's minio/minio; override MINIO_IMAGE if you have your own.
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    user: "0"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/atomic && exec /opt/bitnami/minio/bin/minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atomicdev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-dev-only}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # In the admin panel use endpoint http://minio:9000, bucket "atomic", path-style on, allow http on.

volumes:
  atomic-data:
  caddy-data:
  caddy-config:
  ntfy-data:
  minio-data:
