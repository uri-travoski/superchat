# Builds every artifact when a tag like v1.4.0 is pushed and attaches them to the GitHub Release.
# Android signing is mandatory: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD (docs/DEPLOY.md, "Android signing"). The Android job fails with an error when one is missing, so a
# release can never ship an APK signed with a throw-away key that installed apps would refuse to update to.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach artifacts to, e.g. v1.4.0 (built from the selected branch)"
        required: true
permissions:
  contents: write
  packages: write
env:
  VERSION: ${{ inputs.tag || github.ref_name }}
jobs:
  linux:
    needs: release-files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libssl-dev libasound2-dev pkg-config libfuse2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release -p atomic-desktop
      - run: cargo deb -p atomic-desktop --no-build --output dist/
      - run: packaging/linux/build-appimage.sh
      - run: |
          cd dist
          for f in *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256
  windows:
    needs: release-files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        env:
          # The vendored OpenSSL (SQLCipher cache) needs a full Perl; the MSYS Perl in Git Bash lacks modules.
          OPENSSL_SRC_PERL: C:\Strawberry\perl\bin\perl.exe
        run: |
          cargo build --release -p atomic-desktop
          V="${VERSION#v}"
          mkdir -p dist
          cp target/release/superchat.exe "dist/superchat-$V-x64-portable.exe"
      - name: Installer (NSIS)
        shell: bash
        run: |
          choco install nsis -y --no-progress
          V="${VERSION#v}"
          "/c/Program Files (x86)/NSIS/makensis.exe" "//DVERSION=$V" packaging/windows/installer.nsi
      - name: Checksums
        shell: bash
        run: cd dist && for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
  android:
    needs: release-files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages (preinstalled SDK on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;27.1.12297006" "build-tools;35.0.0"
      - run: cargo install cargo-ndk --locked
      - name: Signing key (required)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Every run of this workflow publishes a release (a tag push, or a manual run for an existing tag), and installed apps
          # can only update to an APK signed with the same key. So a missing key is an error, never a throw-away key.
          missing=""
          [ -n "$KS_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KS_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KS_KEYPASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Android signing secrets missing::Not building the release APK: the repository secrets${missing} are not set. A release APK must be signed with the one permanent key, otherwise installed apps cannot update to it. Set the four secrets (Settings > Secrets and variables > Actions) as described in docs/DEPLOY.md, section 'Android signing', then re-run this workflow."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ATOMIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ATOMIC_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "ATOMIC_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "ATOMIC_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties
          cd apps/android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: |
          mkdir -p dist
          V="${VERSION#v}"
          # One APK per ABI (gradle `splits`): arm64-v8a for phones and boxes, x86_64 for emulators and Chromebooks. The in-app update
          # check picks the one that matches the device (Build.SUPPORTED_ABIS).
          out=apps/android/app/build/outputs/apk/release
          cp "$out"/*arm64-v8a*.apk "dist/superchat-$V-android-arm64.apk"
          cp "$out"/*x86_64*.apk "dist/superchat-$V-android-x86_64.apk"
          cd dist
          for f in superchat-$V-android-arm64.apk superchat-$V-android-x86_64.apk; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
  release-files:
    # Creates the release first (name "SuperChat <version>", body from docs/RELEASE-NOTES-<tag>.md when that file exists) and attaches
    # the two server install files; the app jobs below wait for it and only add their files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install files and release notes
        run: |
          V="${VERSION#v}"
          # The compose file pins the image it was released with: refuse a release whose compose default is another version.
          if ! grep -q "ghcr.io/uri-travoski/superchat-server:$V}" deploy/docker-compose.yml; then
            echo "::error title=docker-compose.yml pins another version::deploy/docker-compose.yml must default to ghcr.io/uri-travoski/superchat-server:$V (the tag being released)."
            exit 1
          fi
          mkdir -p dist-release
          cp deploy/docker-compose.yml dist-release/docker-compose.yml
          cp deploy/.env.example dist-release/superchat.env.example
          echo "REL_NAME=SuperChat $V" >> "$GITHUB_ENV"
          if [ -f "docs/RELEASE-NOTES-${VERSION}.md" ]; then echo "NOTES=docs/RELEASE-NOTES-${VERSION}.md" >> "$GITHUB_ENV"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.REL_NAME }}
          body_path: ${{ env.NOTES }}
          files: |
            dist-release/docker-compose.yml
            dist-release/superchat.env.example
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "ver=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/uri-travoski/superchat-server:${{ steps.v.outputs.ver }}
            ghcr.io/uri-travoski/superchat-server:latest
