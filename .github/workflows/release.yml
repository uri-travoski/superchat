# Builds every artifact when a tag like v1.3.0 is pushed and attaches them to the GitHub Release.
# Android signing: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD to sign with your own key. Without them CI generates a throw-away keystore (the APK installs,
# but each release is signed with a different key, so it cannot update a previous install: set the secrets for real use).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
env:
  VERSION: ${{ github.ref_name }}
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libssl-dev pkg-config libfuse2
      - run: cargo install cargo-deb --locked
      - run: cargo build --release -p atomic-desktop
      - run: cargo deb -p atomic-desktop --no-build --output dist/
      - run: packaging/linux/build-appimage.sh
      - run: |
          cd dist
          for f in *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.sha256
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          cargo build --release -p atomic-desktop
          V="${VERSION#v}"
          mkdir -p dist
          cp target/release/superchat.exe "dist/superchat-$V-x64-portable.exe"
      - name: Installer (NSIS)
        shell: bash
        run: |
          choco install nsis -y --no-progress
          V="${VERSION#v}"
          "/c/Program Files (x86)/NSIS/makensis.exe" "//DVERSION=$V" packaging/windows/installer.nsi
      - name: Checksums
        shell: bash
        run: cd dist && for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK packages (preinstalled SDK on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;27.1.12297006" "build-tools;35.0.0"
      - run: cargo install cargo-ndk --locked
      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ATOMIC_KEY_ALIAS=${KS_ALIAS:-atomic}" >> "$GITHUB_ENV"
            echo "ATOMIC_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "ATOMIC_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: generating a throw-away keystore"
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias atomic -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=SuperChat CI, O=SuperChat"
            echo "ATOMIC_KEY_ALIAS=atomic" >> "$GITHUB_ENV"
            echo "ATOMIC_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "ATOMIC_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "ATOMIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties
          cd apps/android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: |
          mkdir -p dist
          V="${VERSION#v}"
          cp apps/android/app/build/outputs/apk/release/*.apk "dist/superchat-$V-android.apk"
          cd dist && sha256sum *.apk > "superchat-$V-android.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "ver=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/uri-travoski/superchat-server:${{ steps.v.outputs.ver }}
            ghcr.io/uri-travoski/superchat-server:latest
