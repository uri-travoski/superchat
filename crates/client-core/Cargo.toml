[package]
name = "atomic-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperChat headless client: login, sync by cursor, local cache, outbox"

[lib]
name = "client_core"

[dependencies]
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
futures-util.workspace = true
url.workspace = true
bytes.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
spellbook = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "aac", "isomp4", "mp3", "ogg", "vorbis", "flac"] }

[dev-dependencies]
atomic-server = { path = "../server" }
tempfile = "3"
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rcgen = "0.13"
axum = "0.8"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
