# SuperChat server: standalone docker compose file. One service, nothing is built here, nothing else is started.
#
#   1. curl -fLO https://github.com/uri-travoski/superchat/releases/latest/download/docker-compose.yml
#      curl -fL -o .env https://github.com/uri-travoski/superchat/releases/latest/download/superchat.env.example
#   2. edit .env (at least SUPERCHAT_PUBLIC_URL)
#   3. docker compose up -d            -> http://<this machine>:8080/admin
#
# Update:  set SUPERCHAT_IMAGE in .env to the new version (or download the new docker-compose.yml from the release), then
#   docker compose pull && docker compose up -d
#
# No reverse proxy, Cloudflare Tunnel, ntfy or object store is included: run those separately (see docs/DEPLOY.md).
# Attachments go to S3, Cloudflare R2, Backblaze B2 or Google Drive, chosen in the admin panel (Storage page).
# Works with `docker compose` (v2) and `docker-compose` (v1).

name: superchat

services:
  superchat:
    # The published, public image. The default is pinned to the release this file belongs to, so an update is a conscious
    # step. To follow the newest release instead, put this in .env:
    #   SUPERCHAT_IMAGE=ghcr.io/uri-travoski/superchat-server:latest
    image: ${SUPERCHAT_IMAGE:-ghcr.io/uri-travoski/superchat-server:1.4.1}
    restart: unless-stopped
    environment:
      # All optional. The server reads the SUPERCHAT_* names (the old ATOMIC_* names also work there).
      SUPERCHAT_PUBLIC_URL: ${SUPERCHAT_PUBLIC_URL:-}
      SUPERCHAT_NAME: ${SUPERCHAT_NAME:-SuperChat}
      SUPERCHAT_BOOTSTRAP_ADMIN: ${SUPERCHAT_BOOTSTRAP_ADMIN:-}
      SUPERCHAT_MAX_UPLOAD_MB: ${SUPERCHAT_MAX_UPLOAD_MB:-100}
      # Your own ntfy server (a separate container). Empty = no ntfy push.
      SUPERCHAT_NTFY_URL: ${SUPERCHAT_NTFY_URL:-}
      # Empty = a random passphrase is generated into /data/backup.key on first start.
      SUPERCHAT_BACKUP_PASSPHRASE: ${SUPERCHAT_BACKUP_PASSPHRASE:-}
      # trace, debug, info, warn, error, or a filter such as info,tower_http=warn
      RUST_LOG: ${SUPERCHAT_LOG_LEVEL:-info,tower_http=warn}
    volumes:
      - superchat-data:/data
    ports:
      # Behind a tunnel or proxy on this machine use SUPERCHAT_BIND_ADDR=127.0.0.1; on a shared Docker network (see below)
      # you can remove this section altogether.
      - "${SUPERCHAT_BIND_ADDR:-0.0.0.0}:${SUPERCHAT_PORT:-8080}:8080"
    extra_hosts:
      # Lets the server reach an ntfy (or anything else) running on the host: http://host.docker.internal:<port>
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/superchat-server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Optional: join a Docker network that your own cloudflared / ntfy / reverse-proxy containers also use. They then reach
    # this server as http://superchat:8080 with no published port. Create it once with `docker network create proxy`, or
    # use the name of the network your other compose project already has, then uncomment these lines and the `networks:`
    # block at the bottom.
    # networks:
    #   - default
    #   - proxy

# networks:
#   proxy:
#     external: true
#     name: ${SUPERCHAT_NETWORK:-proxy}

volumes:
  superchat-data:
    # All server data lives here: database, settings, backups, local files. A 1.0-era install (project "atomic-chat")
    # created the volume `atomic-chat_atomic-data`: to keep that data set SUPERCHAT_DATA_VOLUME=atomic-chat_atomic-data in .env.
    name: ${SUPERCHAT_DATA_VOLUME:-superchat-data}
