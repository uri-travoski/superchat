name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Build tools for the UI crate
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libgl1-mesa-dev libssl-dev pkg-config
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Admin panel build (served by the server tests)
        run: cd admin-web && npm ci && npm run build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -A warnings
  windows:
    # X-02 / X-04: the Windows build (Credential Manager store, SQLCipher with vendored OpenSSL, screen recording) is not
    # buildable in the development environment, so this job compiles the desktop app and runs the Credential Manager test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Credential Manager round trip and the desktop unit tests
        shell: bash
        run: cargo test -p atomic-desktop --lib
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd admin-web && npm ci && npm run build
