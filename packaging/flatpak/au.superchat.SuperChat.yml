# Flatpak manifest (not built in CI: it needs vendored cargo sources, see docs/DEPLOY.md). Build locally with
#   flatpak-builder --user --install --force-clean build packaging/flatpak/au.superchat.SuperChat.yml
# after running `cargo build --release -p atomic-desktop` (this manifest packages the prebuilt binary).
app-id: au.superchat.SuperChat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: superchat
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: superchat
    buildsystem: simple
    build-commands:
      - install -Dm755 superchat /app/bin/superchat
      - install -Dm644 superchat.desktop /app/share/applications/au.superchat.SuperChat.desktop
      - install -Dm644 superchat-256.png /app/share/icons/hicolor/256x256/apps/au.superchat.SuperChat.png
      - install -Dm644 LICENSE /app/share/licenses/au.superchat.SuperChat/LICENSE
      - install -Dm644 THIRD-PARTY-NOTICES.txt /app/share/licenses/au.superchat.SuperChat/THIRD-PARTY-NOTICES.txt
      - sed -i 's/^Icon=.*/Icon=au.superchat.SuperChat/' /app/share/applications/au.superchat.SuperChat.desktop
    sources:
      - type: file
        path: ../../target/release/superchat
      - type: file
        path: ../linux/superchat.desktop
      - type: file
        path: ../../assets/icon/superchat-256.png
      - type: file
        path: ../../LICENSE
      - type: file
        path: ../../THIRD-PARTY-NOTICES.txt
