[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/server",
  "crates/client-core",
  "crates/cli",
  "apps/desktop",
  "apps/android",
  "tests/e2e",
]

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/uri-travoski/superchat"
authors = ["SuperChat contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
uuid = { version = "1", features = ["v4", "v7"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
proto = { package = "atomic-proto", path = "crates/proto" }
client-core = { package = "atomic-client-core", path = "crates/client-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.release.package."*"]
opt-level = "s"
