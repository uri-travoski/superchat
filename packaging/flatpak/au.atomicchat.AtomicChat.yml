# Flatpak manifest (not built in CI: it needs vendored cargo sources, see docs/DEPLOY.md). Build locally with
#   flatpak-builder --user --install --force-clean build packaging/flatpak/au.atomicchat.AtomicChat.yml
# after running `cargo build --release -p atomic-desktop` (this manifest packages the prebuilt binary).
app-id: au.atomicchat.AtomicChat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: atomic-chat
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
modules:
  - name: atomic-chat
    buildsystem: simple
    build-commands:
      - install -Dm755 atomic-chat /app/bin/atomic-chat
      - install -Dm644 atomic-chat.desktop /app/share/applications/au.atomicchat.AtomicChat.desktop
      - install -Dm644 atomic-chat-256.png /app/share/icons/hicolor/256x256/apps/au.atomicchat.AtomicChat.png
      - sed -i 's/^Icon=.*/Icon=au.atomicchat.AtomicChat/' /app/share/applications/au.atomicchat.AtomicChat.desktop
    sources:
      - type: file
        path: ../../target/release/atomic-chat
      - type: file
        path: ../linux/atomic-chat.desktop
      - type: file
        path: ../../assets/icon/atomic-chat-256.png
